<script>
// ===== Multi-hero 2D cutout prototype =====
const Q=new URLSearchParams(location.search);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function rs(){const d=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d}addEventListener('resize',rs);rs();
const cl=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ss=k=>k*k*(3-2*k),eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,ein=k=>k*k*k,eout=k=>1-Math.pow(1-k,3),
 eback=k=>{const c=1.7;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)},seg=(k,a,b)=>cl((k-a)/(b-a),0,1),TAU=Math.PI*2;
const IMG={};
function loadAll(list,cb){let n=0;list.forEach(f=>{if(IMG[f]){if(++n==list.length)cb();return}const i=new Image();i.onload=i.onerror=()=>{if(++n==list.length)cb()};i.src='img2d/'+f+'.png';IMG[f]=i})}
const dc={};function dark(f,k){const key=f+k;if(dc[key])return dc[key];const i=IMG[f],c=document.createElement('canvas');c.width=i.width;c.height=i.height;const g=c.getContext('2d');g.drawImage(i,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(20,25,60,${k})`;g.fillRect(0,0,c.width,c.height);return dc[key]=c}
// part: {f,p:[px,py],s:[sx,sy]|n,flip}
function D(pt,dk){if(!pt)return;const s=Array.isArray(pt.s)?pt.s:[pt.s,pt.s];ctx.save();ctx.scale(s[0]*(pt.flip?-1:1),s[1]);const im=dk?dark(pt.f,(typeof dk==='number'&&dk<1)?dk:.38):IMG[pt.f];if(im)ctx.drawImage(im,-pt.p[0],-pt.p[1]);ctx.restore()}
const ang=(x,y)=>Math.atan2(y,x);
// two-bone solve: H->T, local bone vectors v1,v2 (at rot 0). pick: 'fwd' (max x) or 'up' (min y) or 'down'
function solve2(hx,hy,tx,ty,v1,v2,pick){const l1=Math.hypot(...v1),l2=Math.hypot(...v2);let dx=tx-hx,dy=ty-hy,d=Math.hypot(dx,dy);const m=l1+l2-.3;if(d>m){dx*=m/d;dy*=m/d;d=m}if(d<Math.abs(l1-l2)+.3)d=Math.abs(l1-l2)+.3;
 const b=ang(dx,dy),al=Math.acos(cl((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
 const c=[b-al,b+al].map(a=>[hx+l1*Math.cos(a),hy+l1*Math.sin(a)]);
 let K=pick==='fwd'?(c[0][0]>c[1][0]?c[0]:c[1]):pick==='up'?(c[0][1]<c[1][1]?c[0]:c[1]):pick==='back'?(c[0][0]<c[1][0]?c[0]:c[1]):(c[0][1]>c[1][1]?c[0]:c[1]);
 const T=[hx+dx,hy+dy];return {K,T,r1:ang(K[0]-hx,K[1]-hy)-ang(...v1),r2:ang(T[0]-K[0],T[1]-K[1])-ang(...v2)}}
const rotv=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a),v[0]*Math.sin(a)+v[1]*Math.cos(a)];
// ===== world / fx =====
let camX=0,shake=0,CS=.62,GY=560;const FX=[];
const W2S=(wx,wy)=>[W/2+(wx-camX)*(H/720),GY*(H/720)+wy*(H/720)];
const S2W=(px,py)=>[camX+(px-W/2)/(H/720),(py-GY*(H/720))/(H/720)];
function addFX(o){o.t=0;FX.push(o);return o}
function tickFX(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;if(f.up)f.up(f,dt);if(f.t>=f.life)FX.splice(i,1)}}
function drawFX(layer){const U=H/720;FX.forEach(f=>{if((f.layer||'front')!==layer)return;ctx.save();const[p,q]=W2S(f.x,f.y);ctx.translate(p,q);f.draw(f,U,f.t/f.life);ctx.restore()})}
const FXL={
 ring:(x,y,size,col='255,240,180')=>addFX({x,y,life:.5,layer:'back',draw:(f,U,k)=>{const e=eout(k);ctx.strokeStyle=`rgba(${col},${1-k})`;ctx.lineWidth=(14*(1-e)+3)*size*U;ctx.beginPath();ctx.ellipse(0,0,(40+260*e)*size*U,(12+70*e)*size*U,0,0,TAU);ctx.stroke()}}),
 flash:(x,y,r,col='255,255,255')=>addFX({x,y,life:.14,draw:(f,U,k)=>{ctx.fillStyle=`rgba(${col},${.9*(1-k)})`;ctx.beginPath();ctx.arc(0,0,r*(.5+k)*U,0,TAU);ctx.fill()}}),
 spark:(x,y,n,col,spd=300,sz=6,grav=600)=>{for(let i=0;i<n;i++){const a=Math.random()*TAU,v=spd*(.4+Math.random()*.6);addFX({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.3,life:.35+Math.random()*.3,up:(f,dt)=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=grav*dt},draw:(f,U,k)=>{ctx.fillStyle=col;ctx.globalAlpha=1-k;ctx.beginPath();ctx.arc(0,0,sz*(1-k*.6)*U,0,TAU);ctx.fill()}})}},
 star4:(x,y,r,col)=>addFX({x,y,life:.45,rot:Math.random(),draw:(f,U,k)=>{ctx.rotate(f.rot+k*2);ctx.fillStyle=col;ctx.globalAlpha=1-k;const R=r*U*(k<.3?k/.3:1);ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?R*.25:R;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.fill()}}),
 dust:(x,n,spread)=>{for(let i=0;i<n;i++)addFX({x:x+(Math.random()-.5)*spread,y:-4,vx:(Math.random()-.5)*120,vy:-20-Math.random()*30,r:6+Math.random()*5,life:.45,up:(f,dt)=>{f.x+=f.vx*dt;f.y+=f.vy*dt},draw:(f,U,k)=>{ctx.fillStyle=`rgba(235,225,190,${.6*(1-k)})`;ctx.beginPath();ctx.arc(0,0,(f.r+k*12)*U,0,TAU);ctx.fill()}})},
 swoosh:(x,y,face,r,a0,a1,col,w=1)=>addFX({x,y,life:.2,draw:(f,U,k)=>{ctx.scale(face,1);ctx.strokeStyle=col;ctx.globalAlpha=(1-k)*.85;ctx.lineCap='round';ctx.lineWidth=22*w*U*(1-k*.5);ctx.beginPath();ctx.arc(0,0,r*U,a0,lerp(a0,a1,Math.min(1,.6+k)),a1<a0);ctx.stroke();ctx.lineWidth=8*w*U;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke()}}),
};
// ===== character =====
function newChar(hero,x,face){return {hero,x,y:0,vy:0,face,mode:'idle',t:0,act:null,at:0,combo:0,hitstop:0,alpha:1,trail:[],sp:{head:0,headV:0,hel:0,helV:0,ear:0,earV:0,ham:0,hamV:0,tail:0,tailV:0},prev:null,mats:{},fxState:{}}}
function setMode(ch,m){ch.mode=m;ch.t=0;ch.at=0;ch.act=null;ch.landT=0;ch.jumpT=0;if(m==='jump'){ch.vy=0}
 const A=ch.hero.acts[m];if(A){ch.act=A;ch.actName=m;if(A.start)A.start(ch)}}
function basePose(ch){const h=ch.hero,m=ch.mode,t=ch.t;const o=Object.assign({},h.rest);o.fF=[...h.rest.fF];o.fB=[...h.rest.fB];o.footRel=false;o.footRotF=0;o.footRotB=0;
 if(m==='idle'||ch.act&&ch.act.base==='idle'){const b=Math.sin(t*2.6);o.breath=b;o.hy=h.rest.hy+b*1.5;o.shF+=b*.04;o.shB-=b*.04;o.elF-=b*.05;o.head=Math.sin(t*1.3)*.03}
 if(m==='run'||ch.act&&ch.act.base==='run'){const Tc=h.Tc,p=((ch.runT||t)/Tc)%1,S=h.stride,lift=h.lift;
  const leg=q=>{q=(q%1+1)%1;if(q<.5){const k=q/.5;return [S/2-S*k,0,0]}const k=(q-.5)/.5,e=ss(k);return [-S/2+S*e,-Math.sin(Math.PI*k)*lift*(k<.5?1.15:.85),k<.35?.55*(1-k/.35)*-1+0:k>.8?-.15:0]};
  const a=leg(p),b=leg(p+.5);o.fF=[a[0]+h.rest.fF[0]*.5,a[1]];o.fB=[b[0]+h.rest.fB[0]*.5,b[1]];o.footRotF=a[2]*-1;o.footRotB=b[2]*-1;
  // toe-off: rotate foot toe-down during early swing
  const c=Math.cos(4*Math.PI*(p-.25));o.hy=h.rest.hy+h.legLen*.06+h.legLen*.055*c;o.hx=h.legLen*.02*Math.sin(TAU*p)+4;o.lean=.13+.03*c;o.sy=1-.02*c;o.sx=1+.012*c;
  const w=Math.cos(TAU*p);o.shB=-.75*w*h.armSwing;o.elB=-1.2+.3*w;o.shF=.75*w*h.armSwing;o.elF=-1.2-.3*w;o.head=-.04+.02*Math.sin(4*Math.PI*p);o.runP=p;
  if(h.runPose)h.runPose(o,p,w)}

  if(j<.14){const k=ss(j/.14);o.hy=lerp(h.rest.hy,h.rest.hy+h.legLen*.25,k);o.sx=1+.1*k;o.sy=1-.12*k;o.shF+=.3*k;o.shB+=.4*k}
  else if(ch.landT>0){const k=ch.landT/.18;o.hy=lerp(h.rest.hy,h.rest.hy+h.legLen*.25,k);o.sx=1+.1*k;o.sy=1-.12*k}
  else{const v=ch.vy/900;o.sy=1+cl(-v,-.3,1)*.12;o.sx=1-cl(-v,-.3,1)*.08;o.footRel=true;o.fF=[h.legLen*.3,h.legLen*.62];o.fB=[-h.legLen*.1,h.legLen*.7];o.footRotF=-.3;o.footRotB=.25;o.shF=-1.3+v*.3;o.elF=-.5;o.shB=-2.2+v*.3;o.elB=-.5;o.lean=.05;if(h.jumpPose)h.jumpPose(o)}}
 return o}
function getPose(ch){const o=basePose(ch);if(ch.act&&ch.act.pose)ch.act.pose(o,ch.at,ch);return o}
function springs(ch,dt,o){const s=ch.sp,pr=ch.prev||o,id=Math.max(dt,1e-3);const vy=(o.hy-pr.hy)/id+(ch.vy||0)*.15,va=((o.propA||0)-(pr.propA||0))/id;

function update(ch,dt){
 if(ch.hitstop>0){ch.hitstop-=dt;return}
 ch.t+=dt;const h=ch.hero;
 if(ch.mode==='run'){ch.runT=(ch.runT||0)+dt;ch.x+=ch.face*(h.stride/(h.Tc/2))*CS*dt;const p=(ch.runT/h.Tc)%1,pp=((ch.runT-dt)/h.Tc)%1;if((pp<.5)!==(p<.5))FXL.dust(ch.x,1,10)}

  if(ch.jumpT>=.14&&!(ch.landT>0)&&ch.landT!==-1){ch.vy+=2700*dt;ch.y+=ch.vy*dt;if(ch.y>=0&&ch.vy>0){ch.y=0;ch.vy=0;ch.landT=.18;FXL.dust(ch.x,8,80)}}

// ===== draw =====
function M(){return ctx.getTransform()}
function drawChar(ch,o,ghost){const h=ch.hero,U=H/720,S=CS*U;const[sx,sy]=W2S(ch.x,0);
 ctx.save();ctx.translate(sx,sy);
 if(!ghost){const sh=Math.max(.35,1+ch.y/420);ctx.fillStyle='rgba(30,60,20,.28)';ctx.beginPath();ctx.ellipse(0,0,h.shadow*S*sh,20*S*sh,0,0,TAU);ctx.fill()}
 ctx.translate(0,ch.y*S);ctx.scale(S*ch.face,S);ctx.scale(o.sx,o.sy);
 const L=h.leg;const hipF=[o.hx+L.hipF[0],o.hy+L.hipF[1]],hipB=[o.hx+L.hipB[0],o.hy+L.hipB[1]];
 const legGeo=(hip,f,rel,rot)=>{const fp=rel?[hip[0]+f[0],hip[1]+f[1]]:[f[0],f[1]];const sv=rotv(L.sole,rot),ank=[fp[0]-sv[0],fp[1]-sv[1]];return Object.assign(solve2(hip[0],hip[1],ank[0],ank[1],L.knee,L.ankle,'fwd'),{rot})};

  ctx.save();ctx.translate(...hip);ctx.rotate(g.r1);D(h.P.thigh,dk);ctx.restore();
  ctx.save();ctx.translate(...g.K);ctx.rotate(g.r2);D(h.P.shin,dk);ctx.restore();
  ctx.save();ctx.translate(...g.T);ctx.rotate(g.rot);D(h.P.foot,dk);ctx.restore()};
 const torsoFrame=()=>{ctx.translate(o.hx,o.hy+h.torsoDY);ctx.rotate(o.lean)};
 const A=h.arm;
 // arm angles: FK or IK
 const armAng=(side)=>{const ik=o['ik'+side];const sp=A['sh'+side];if(ik){const r=solve2(sp[0],sp[1],ik[0],ik[1],A.elb,[A.wri[0]+A.grip[0],A.wri[1]+A.grip[1]],ik[2]||'down');return [r.r1,r.r2-r.r1,o['wr'+side]||0]}return [o['sh'+side],o['el'+side],o['wr'+side]||0]};
 const arm=(side,dk,prop,partsMask='uphf')=>{const[a1,a2,a3]=armAng(side);ctx.save();torsoFrame();ctx.translate(...A['sh'+side]);ctx.rotate(a1);if(partsMask.includes('u'))D(h.P.ua,dk);
  ctx.translate(...A.elb);ctx.rotate(a2);ctx.save();ctx.translate(...A.wri);ctx.rotate(a3);
  const FST=side==='B'&&h.fist;if(FST&&partsMask.includes('p')){ctx.save();ctx.translate(...A.grip);h.fist(0,dk);ctx.restore()}
  if(prop&&partsMask.includes('p')){ctx.save();ctx.translate(...A.grip);ctx.rotate((o.propA||0)-o.lean-a1-a2-a3+ch.sp.ham*(h.propLag||0));prop();ctx.restore()}
  ch.mats['hand'+side]=M().translate(...A.grip);
  if(partsMask.includes('h')){if(FST){ctx.save();ctx.translate(...A.grip);h.fist(1,dk);ctx.restore()}else D(h.P.hand,dk)}ctx.restore();if(partsMask.includes('f')){D(h.P.fa,dk);if(h.faUnder){ctx.rotate(-a2);ctx.translate(-A.elb[0],-A.elb[1]);D(h.P.ua,dk)}}ctx.restore()};
 const ctxObj={o,ch,h,arm,torsoFrame,legDraw,gF,gB,hipF,hipB,head:()=>{ctx.save();torsoFrame();ctx.translate(h.neck[0],h.neck[1]+(o.breath||0)*-1.2);ctx.rotate(o.head+ch.sp.head);D(h.P.head);if(h.headExtra)h.headExtra(ch,o);ctx.restore()},
  torso:()=>{ctx.save();torsoFrame();ctx.scale(1-(o.breath||0)*.012,1+(o.breath||0)*.018);D(h.P.torso);ctx.restore()}};
 h.drawOrder(ctxObj);
 ctx.restore()}
function bg(t){

 ctx.fillStyle='#fff';ctx.globalAlpha=.88;for(let i=0;i<6;i++){const x=((i*370-camX*.1+t*12)%(WW+400)+WW+400)%(WW+400)-200,y=60+(i*53)%140;[0,40,80,30].forEach((d,k)=>{ctx.beginPath();ctx.arc((x+d)*U,(y-(k%2)*20)*U,(30+k*6)*U,0,TAU);ctx.fill()})}ctx.globalAlpha=1;

 hill('#9fd18a',330,30,.2,.004);hill('#7dc160',380,22,.4,.006);
 for(let i=0;i<16;i++){const x=i*160+((i*97)%60)-camX*.4;const xx=((x%(WW+320))+WW+320)%(WW+320)-160,y=385+Math.sin(i)*12;ctx.fillStyle='#6b4a2b';ctx.fillRect((xx-4)*U,(y-10)*U,8*U,24*U);ctx.fillStyle='#2f8a3e';ctx.beginPath();ctx.arc(xx*U,(y-22)*U,22*U,0,TAU);ctx.fill();ctx.fillStyle='#45a650';ctx.beginPath();ctx.arc((xx-6)*U,(y-28)*U,12*U,0,TAU);ctx.fill()}
 ctx.fillStyle='#78c24e';ctx.fillRect(0,430*U,W,H);const lg=ctx.createLinearGradient(0,470*U,0,640*U);lg.addColorStop(0,'#8fd65c');lg.addColorStop(1,'#6fb544');ctx.fillStyle=lg;ctx.fillRect(0,470*U,W,170*U);
 ctx.fillStyle='#5a3a26';ctx.fillRect(0,640*U,W,H);ctx.fillStyle='#4a9c34';ctx.fillRect(0,636*U,W,8*U);

function renderChar(ch){const h=ch.hero;
 if(h.preDraw)h.preDraw(ch);

// ===== helpers for actions =====
const lerpPose=(o,a,b,k,keys)=>keys.forEach(kk=>o[kk]=lerp(a[kk],b[kk],k));
function hitstop(ch,t){ch.hitstop=Math.max(ch.hitstop,t)}

// ================= MUNGCHI =================
const MUNG={name:'뭉치',key:'mungchi',Tc:.46,stride:120,lift:45,legLen:153,armSwing:1,shadow:95,torsoDY:30,neck:[10,-128],propLag:1,
 P:{torso:{f:'mungchi/torso',p:[72,178],s:[1,.92]},head:{f:'mungchi/head',p:[96,200],s:.92},helmet:{f:'mungchi/helmet',p:[96,200],s:.94},ear:{f:'mungchi/ear',p:[96,200],s:.95},
  ua:{f:'mungchi/upperarm',p:[70,28],s:.62},fa:{f:'mungchi/forearm2',p:[52,19],s:.62},hand:{f:'mungchi/hand',p:[52,7],s:.62},
